name: datatrace
version: "1.0.0"
profile: datatrace

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

# api_reader (infra/db_roles.sql) may read marts and nothing else. Schema usage is granted here
# because it outlives any one model; table grants below, because dbt recreates tables on every build.
on-run-start:
  - "create schema if not exists marts"
  - "grant usage on schema marts to api_reader"

models:
  datatrace:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
      +materialized: table
      +grants:
        select: ["api_reader"]

vars:
  # Boards no longer in config/boards.toml. See the not_retired_board macro for why retiring a
  # board has to happen here as well as in the config.
  retired_boards: ["smartrecruiters/Equinox"]

  # Days after its publish date that a posting stops counting as open, however long the board
  # keeps showing it. See is_stale in fct_job_postings.
  stale_after_days: 365

data_tests:
  datatrace:
    staging:
      # Staging views re-parse all of raw.job_postings, which grows by a full run every day.
      # Testing only recent observations keeps test time flat; older rows were tested on their day.
      +where: "observed_at >= current_date - 2"

seeds:
  datatrace:
    +schema: seeds
