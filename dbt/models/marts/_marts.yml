version: 2

models:
  - name: fct_job_postings
    description: >
      Accumulating snapshot, one row per US-accessible posting, with its latest attributes and
      first/last seen timestamps. Updated in place as later runs see (or stop seeing) the posting.
    columns:
      - name: posting_key
        description: source:board:posting_id
        data_tests: [unique, not_null]
      - name: company_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_companies')
                field: company_key
      - name: role_family
        description: >
          Bucketed by the role_family macro: title keywords first, department as a fallback for the
          ~25% of titles with no domain word. Pinned by seeds/role_title_cases.csv.
        data_tests:
          - accepted_values:
              arguments:
                values: [data_engineering, data_science_ml, data_analytics, sales_success, marketing, design, product, engineering, corporate, operations_support, hospitality_fitness, healthcare, other]
      - name: seniority
        description: >
          Seniority from title keywords. 'mid' means the posting said so ("Engineer II"); titles
          stating no level are 'unspecified' rather than being assumed mid.
        data_tests:
          - accepted_values:
              arguments:
                values: [intern, entry, mid, senior, staff_plus, director_plus, unspecified]
      - name: first_seen_at
        description: First ingest run that saw the posting. Not the publish date; bounded below by when ingestion started.
        data_tests: [not_null]
      - name: is_active
        description: >
          Seen in the most recent run that returned this board's postings. Null for RemoteOK, whose
          feed is a rolling window of recent jobs, so absence doesn't mean closed.
        data_tests:
          - not_null:
              config:
                where: "source <> 'remoteok'"
      - name: days_listed
        description: >
          Days from publish (or first seen, if the source has no publish date) to last seen. Total
          lifetime for closed postings, age so far for active ones. Closed postings actually closed
          somewhere between last_seen_at and the next run, so this undercounts by up to one run interval.
      - name: is_remote_anywhere
        description: Remote with no region stated. Counted as US-accessible, though some of these may quietly exclude US hires.
      - name: salary_interval
        description: Pay period normalised across sources to year, month, week, day or hour.
        data_tests:
          - accepted_values:
              arguments:
                values: [year, month, week, day, hour]

  - name: dim_companies
    description: One row per hiring company, keyed on the normalized company name.
    columns:
      - name: company_key
        description: md5 of lower(trim(company name)).
        data_tests: [unique, not_null]
      - name: company_name
        description: Most common spelling of the name across observations.
        data_tests: [not_null]
      - name: sources
        description: Comma-separated sources the company has posted on.

  - name: rpt_postings
    description: >
      Denormalised copy of fct_job_postings for Tableau Public, which can't query Postgres. Exported
      to CSV by datatrace-export. Labels are display-ready; filter on is_open for current postings.
    columns:
      - name: posting_key
        data_tests: [unique, not_null]
      - name: company_name
        data_tests: [not_null]
      - name: seniority_rank
        description: 1 (intern) to 6 (director+), 7 unspecified, for sorting seniority in Tableau.
        data_tests: [not_null]
      - name: salary_annual_mid_usd
        description: >
          Midpoint of the USD pay range, annualised (2,080 hours, 260 days, 52 weeks). Null when the
          posting has no USD pay or the result falls outside 15k-1M, which means a mislabelled interval.
      - name: is_open
        description: is_active, with RemoteOK's null counted as open.
      - name: data_as_of
        description: Latest ingest run in the warehouse, repeated on every row for the dashboard footer.
