version: 2

models:
  - name: fct_job_postings
    description: >
      Accumulating snapshot, one row per US-accessible posting, with its latest attributes and
      first/last seen timestamps. Updated in place as later runs see (or stop seeing) the posting.
    columns:
      - name: posting_key
        description: source:board:posting_id
        data_tests: [unique, not_null]
      - name: company_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_companies')
                field: company_key
      - name: role_family
        description: >
          Bucketed by the role_family macro: title keywords first, department as a fallback for the
          ~25% of titles with no domain word. Pinned by seeds/role_title_cases.csv.
        data_tests:
          - accepted_values:
              arguments:
                values: [data_engineering, data_science_ml, data_analytics, sales_success, marketing, design, product, engineering, corporate, operations_support, hospitality_fitness, healthcare, other]
      - name: seniority
        description: >
          Seniority from title keywords. 'mid' means the posting said so ("Engineer II"); titles
          stating no level are 'unspecified' rather than being assumed mid.
        data_tests:
          - accepted_values:
              arguments:
                values: [intern, entry, mid, senior, staff_plus, director_plus, unspecified]
      - name: first_seen_at
        description: First ingest run that saw the posting. Not the publish date; bounded below by when ingestion started.
        data_tests: [not_null]
      - name: is_active
        description: >
          Seen in the most recent run that returned this board's postings. Null for RemoteOK, whose
          feed is a rolling window of recent jobs, so absence doesn't mean closed.
        data_tests:
          - not_null:
              config:
                where: "source <> 'remoteok'"
      - name: days_listed
        description: >
          Days from publish (or first seen, if the source has no publish date) to last seen. Total
          lifetime for closed postings, age so far for active ones. Closed postings actually closed
          somewhere between last_seen_at and the next run, so this undercounts by up to one run interval.
      - name: is_remote_anywhere
        description: Remote with no region stated. Counted as US-accessible, though some of these may quietly exclude US hires.
      - name: salary_interval
        description: Pay period normalised across sources to year, month, week, day or hour.
        data_tests:
          - accepted_values:
              arguments:
                values: [year, month, week, day, hour]

  - name: dim_companies
    description: One row per hiring company, keyed on the normalized company name.
    columns:
      - name: company_key
        description: md5 of lower(trim(company name)).
        data_tests: [unique, not_null]
      - name: company_name
        description: Most common spelling of the name across observations.
        data_tests: [not_null]
      - name: sources
        description: Comma-separated sources the company has posted on.

  - name: rpt_postings
    description: >
      Denormalised copy of fct_job_postings for Tableau Public, which can't query Postgres. Exported
      to CSV by datatrace-export. Labels are display-ready; filter on is_open for current postings.
    columns:
      - name: posting_key
        data_tests: [unique, not_null]
      - name: company_name
        data_tests: [not_null]
      - name: seniority_rank
        description: 1 (intern) to 6 (director+), 7 unspecified, for sorting seniority in Tableau.
        data_tests: [not_null]
      - name: salary_annual_mid_usd
        description: >
          Midpoint of the USD pay range, annualised (2,080 hours, 260 days, 52 weeks). Null when the
          posting has no USD pay or the result falls outside 15k-1M, which means a mislabelled interval.
      - name: is_open
        description: is_active, with RemoteOK's null counted as open.
      - name: data_as_of
        description: Latest ingest run in the warehouse, repeated on every row for the dashboard footer.

  - name: rpt_stats
    description: >
      Single row of headline counts plus the freshness stamp, for the dashboard header. Pre-aggregated
      here so GET /stats reads one row instead of scanning every posting on each request.
    columns:
      - name: open_postings
        data_tests: [not_null]
      - name: new_this_week
        description: >
          Open postings the board published in the last seven days. Counts published_at, not
          first_seen_at, which only records when our ingest first saw the row.
        data_tests: [not_null]
      - name: data_as_of
        data_tests: [not_null]

  - name: rpt_role_mix
    description: >
      One row per role family: share of all open postings, and how much of that family is remote
      or shows pay. Backs the role mix dashboard section.
    columns:
      - name: role_family
        description: Display label from the role_family_label macro, matching rpt_postings.
        data_tests: [unique, not_null]
      - name: pct_remote
        description: >
          Share that is US-remote or remote-anywhere, the same split rpt_postings.work_mode makes,
          so a family's remote share agrees across dashboard sections.
      - name: pct_with_salary
        description: Mostly tracks source mix (Greenhouse and SmartRecruiters never publish pay), not role.

  - name: rpt_seniority_mix
    description: >
      One row per role family and seniority: pct_of_family is a share of that family, not of all
      postings. Backs the seniority mix dashboard section.
    columns:
      - name: role_family
        description: Display label from the role_family_label macro, matching rpt_postings.
        data_tests: [not_null]
      - name: seniority
        data_tests: [not_null]
      - name: seniority_rank
        description: 1 (intern) to 7 (unspecified). Order by this, not the label, which sorts alphabetically.
        data_tests: [not_null]
      - name: pct_of_family
        data_tests: [not_null]
    data_tests:
      - unique:
          column_name: "role_family || '@' || seniority"

  - name: rpt_salary_by_role
    description: >
      Annualised USD salary midpoints by role family (p25/median/p75), restricted to role families
      with at least 20 salaried postings. Only describes companies on Ashby, Lever, Rippling and
      RemoteOK, since Greenhouse and SmartRecruiters never publish pay. Backs the salary dashboard section.
    columns:
      - name: role_family
        description: Display label, inherited from rpt_postings.
        data_tests: [unique, not_null]

  - name: rpt_time_to_close
    description: >
      Median and p90 days-listed by role family, over closed postings only. Backs the time-to-close
      dashboard section.
    columns:
      - name: role_family
        data_tests: [unique, not_null]

  - name: rpt_daily_flow
    description: >
      One row per day and role family: open postings (stock), opened/closed (flows), and the
      week-over-week change in stock. Excludes RemoteOK, whose rolling feed has no true open/close
      signal. Backs the daily flow dashboard section.
    columns:
      - name: day
        data_tests: [not_null]
      - name: role_family
        data_tests: [not_null]
    data_tests:
      - unique:
          column_name: "day || '@' || role_family"
