datatrace:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: datatrace
      password: datatrace
      dbname: datatrace
      schema: analytics
      threads: 4
    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: 5432
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: datatrace
      schema: analytics
      sslmode: require
      # db.t4g.micro runs on CPU credits and 1 GB of RAM: four parallel connections exhaust them
      # and later connections time out. Two threads, a longer connect timeout, and one retry.
      threads: 2
      connect_timeout: 30
      retries: 2
