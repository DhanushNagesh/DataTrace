version: 2

seeds:
  - name: us_location_cases
    description: Hand-labelled location strings that pin down the is_us_location macro.
    config:
      column_types:
        location: text
        expected_is_us: boolean

  - name: board_companies
    description: Display names for boards whose API carries no company name (Lever, Ashby). Add a row when adding such a board.
    data_tests:
      - unique:
          column_name: "source || ':' || board"
