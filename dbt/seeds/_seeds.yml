version: 2

seeds:
  - name: us_location_cases
    description: Hand-labelled location strings that pin down the is_us_location macro.
    config:
      column_types:
        location: text
        expected_is_us: boolean

  - name: lever_companies
    description: Display names for Lever boards, which carry no company name in the API. Add a row when adding a Lever board.
    columns:
      - name: board
        data_tests: [unique, not_null]
