[project]
name = "datatrace"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.96",
    "dbt-postgres>=1.11.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.96",
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
# Runtime deps shipped in the Lambda zip. boto3 is provided by the Lambda runtime.
lambda = [
    "requests>=2.34.2",
]

[project.scripts]
datatrace-ingest = "datatrace.ingest:main"
datatrace-load = "datatrace.load:main"
datatrace-export = "datatrace.export:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
